name = "ar_transformer"
output_dir = "runs"

[data]
source = "data/training/climbs.jsonl.gz"
vocabulary = "data/training/hold_vocabulary.csv"
cache_dir = "data/cache/baseline"
split_seed = 42
train_fraction = 0.90
validation_fraction = 0.05
max_seq_len = 128
include_computed_grades = true

[model]
d_model = "auto"
n_layers = 2
n_heads = 4
ff_multiplier = 4
dropout = 0.1
positional_embeddings = true
parameters_per_example = 0.5

[train]
seed = 42
epochs = 10
batch_size = 256
learning_rate = 0.0003
weight_decay = 0.01
beta1 = 0.9
beta2 = 0.999
warmup_fraction = 0.05
min_lr_ratio = 0.1
grad_clip = 1.0
patience = 3
device = "auto"
threads = 4
num_workers = 0
length_bucketing = true
log_every = 100
