[project]
name = "kilter-proj"
version = "0.1.0"
description = "Reproducible grade- and angle-conditioned Kilter climb generation experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boardlib>=0.15.1",
    "numpy>=2,<3",
    "pillow>=11.0",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
web = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
wireframe = [
    "mediapipe>=1.2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
